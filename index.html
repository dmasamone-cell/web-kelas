<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X TJKT 4 — Official Class Site</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-slate-200">

  <!-- Navbar Minimalis -->
  <nav class="sticky top-0 z-50 bg-slate-50/80 backdrop-blur-md border-b border-slate-200/80">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <span class="font-bold tracking-tight text-slate-900 text-lg">X TJKT 4</span>
      <div class="space-x-6 text-sm font-medium text-slate-600">
        <a href="#info" class="hover:text-slate-900 transition">Informasi</a>
        <a href="#anggota" class="hover:text-slate-900 transition">Anggota</a>
      </div>
    </div>
  </nav>

<!-- Card Pengurus Kelas (Unik) -->
<div class="relative bg-gradient-to-br from-blue-50 to-white p-6 rounded-2xl border border-blue-100 shadow-sm hover:shadow-md transition">
  
  <!-- Badge "Core Team" biar kelihatan official -->
  <span class="absolute top-4 right-4 text-[10px] font-bold uppercase tracking-widest text-blue-500 bg-blue-100/50 px-2 py-1 rounded-full">Core Team</span>

  <div class="flex items-center gap-4 mb-6">
    <div class="w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-xl">
      P
    </div>
    <div>
      <h3 class="font-bold text-slate-900">Pak Budi, M.Pd</h3>
      <p class="text-xs text-blue-500 font-medium uppercase tracking-wider">Wali Kelas</p>
    </div>
  </div>

  <div class="space-y-3">
    <div class="flex justify-between items-center text-sm border-b border-blue-50 pb-2">
      <span class="text-slate-400">Ketua</span>
      <span class="font-medium text-slate-800">Alex</span>
    </div>
    <div class="flex justify-between items-center text-sm">
      <span class="text-slate-400">Wakil</span>
      <span class="font-medium text-slate-800">Sarah</span>
    </div>
  </div>
</div>

      <!-- Card Pengumuman -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition">
        <h3 class="font-semibold text-slate-900 mb-3 flex items-center gap-2">
          <span>📢</span> Pengumuman
        </h3>
        <p class="text-sm text-slate-600 leading-relaxed">
          Ujian Tengah Semester dimulai minggu depan. Pastikan seluruh berkas tugas praktikum jaringan sudah terkumpul di drive kelas.
        </p>
      </div>
    </div>
  </section>

 <!-- Section Profil Anggota -->
<section id="anggota" class="max-w-4xl mx-auto px-6 py-12">
  <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">Daftar Anggota</h2>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
    
    <!-- Item Anggota 1 (Pake Card Kotak) -->
    <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:border-slate-400 hover:shadow-md transition text-center group">
      <!-- Lingkaran Foto / Profile -->
      <img 
        src="URL_DIRECT_LINK_CATBOX_ALEX.jpg" 
        alt="Foto Alex" 
        class="w-16 h-16 rounded-full mx-auto mb-3 object-cover shadow-sm group-hover:scale-105 transition-transform duration-300"
      >
      <!-- Nama & Jabatan -->
      <h3 class="font-semibold text-slate-900 text-sm">Alex</h3>
      <p class="text-xs text-slate-400 mt-1">Ketua Kelas</p>
    </div>

    <!-- Item Anggota 2 (Pake Card Kotak) -->
    <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:border-slate-400 hover:shadow-md transition text-center group">
      <img 
        src="URL_DIRECT_LINK_CATBOX_SARAH.jpg" 
        alt="Foto Sarah" 
        class="w-16 h-16 rounded-full mx-auto mb-3 object-cover shadow-sm group-hover:scale-105 transition-transform duration-300"
      >
      <h3 class="font-semibold text-slate-900 text-sm">Sarah</h3>
      <p class="text-xs text-slate-400 mt-1">Wakil Ketua</p>
    </div>

    <!-- Kalau mau nambah anggota lagi, tinggal copy-paste 1 blok <div> di atas ini -->

  </div>
</section>

</body>
</html>
